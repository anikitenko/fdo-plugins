apiVersion: fdo.dev/v1alpha1
kind: PluginCollection

metadata:
  name: alexvwan-devops
  displayName: AleXvWaN DevOps Toolkit
  description: Essential AleXvWaN DevOps plugins
  version: 1.0.0
  maintainers:
    - github: anikitenko

spec:
  plugins:
    - name: cute-calculator
      repository: https://github.com/anikitenko/fdo-plugins
      targetRevision: v1.0.0
      path: /cute-calculator
    - name: remote-commands
      repository: https://github.com/anikitenko/fdo-plugins
      targetRevision: main
      path: /remote-commands
    - name: azure-finops
      repository: https://github.com/anikitenko/fdo-plugins
      targetRevision: main
      path: /azure-finops
    - name: hyperstack-availability
      repository: https://github.com/anikitenko/fdo-plugins
      targetRevision: main
      path: /hyperstack-availability
